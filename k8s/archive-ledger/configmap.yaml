apiVersion: v1
kind: ConfigMap
metadata:
  name: archive-ledger-config
data:
  ARCHIVE_LEDGER_DB_URL: jdbc:postgresql://archive-ledger-postgres:5432/archive_ledger
  ARCHIVEOS_BASE_URL: http://archiveos-api:4000
  ARCHIVEOS_APPROVAL_ENABLED: "false"
  ARCHIVE_LEDGER_APPROVAL_THRESHOLD_KRW: "3000000"
  ARCHIVE_LEDGER_AUTO_APPROVAL_MODE: "DISABLED"
  ARCHIVE_LEDGER_AUTO_APPROVAL_POLICY_VERSION: "logistics-amount-only-v1"
  ARCHIVE_LEDGER_AUTO_APPROVAL_MAX_DAILY_COUNT: "20"
  ARCHIVE_LEDGER_AUTO_APPROVAL_MAX_DAILY_AMOUNT_KRW: "10000000"
